<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Sedgwick+Ave+Display&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one column of timeframe "panels" with spray-painted section bars, sticky score rail at the top. Single dark look by design. */
:root {
  --ink: #07090b;        /* page */
  --panel: #0f1418;      /* cards */
  --panel-2: #151c21;    /* rows */
  --line: #22303a;
  --fg: #eef3f2;
  --muted: #8a9ba3;
  --teal: #19d3c5;
  --teal-dim: #0f5f5a;
  --red: #ff3b4e;
  --red-dim: #5c1820;
  --amber: #ffb547;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --tag: "Sedgwick Ave Display", "Permanent Marker", "Comic Sans MS", cursive;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; margin: 0;
  background-image: radial-gradient(circle at 12% -10%, rgba(25,211,197,.13), transparent 40%), radial-gradient(circle at 100% 0%, rgba(255,59,78,.10), transparent 35%);
  background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* top nav */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 40px; height: 40px; border-radius: 8px; background: var(--fg); color: var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 13px; line-height: .9; text-align: center; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--red); }
.brand .nm { font-family: var(--cond); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 14px; color: var(--muted); }
.tabs { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.tabs button { background: none; border: 0; padding: 8px 14px; border-radius: 7px; font-family: var(--cond); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--teal); color: var(--ink); }

/* hero */
.hero { position: relative; padding-block: 18px 26px; }
.hero h1 { margin: 0; font-family: var(--tag); font-weight: 400; font-size: clamp(54px, 13vw, 118px); line-height: .82; letter-spacing: -1px; color: var(--fg); text-shadow: 4px 4px 0 var(--red), 8px 8px 0 rgba(25,211,197,.55); transform: rotate(-2deg); transform-origin: left; text-wrap: balance; }
.hero h1 span { color: var(--teal); text-shadow: 4px 4px 0 var(--ink), 7px 7px 0 var(--red); }
.hero p { margin: 18px 0 0; max-width: 56ch; color: var(--muted); font-size: 17px; }
.drip { display: inline-block; margin-top: 22px; font-family: var(--display); font-size: 12px; letter-spacing: .1em; color: var(--ink); background: var(--red); padding: 6px 10px 8px; transform: rotate(-3deg); border-radius: 3px; }

/* trade setup row */
.setup { display: grid; grid-template-columns: 1fr auto; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
.setup label, .lbl { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--muted); display: block; margin-bottom: 8px; }
.pairs { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.pairs button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .04em; color: var(--fg); }
.pairs button[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.dir { display: flex; gap: 8px; align-self: start; }
.dir button { border: 2px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 9px 16px; font-family: var(--display); font-size: 14px; }
.dir button.buy[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--ink); }
.dir button.sell[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--ink); }
@media (max-width: 640px) { .setup { grid-template-columns: 1fr; } }

/* sticky score rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(7,9,11,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); margin-bottom: 18px; }
.rail-in { display: grid; grid-template-columns: repeat(5, 1fr) 1.3fr; gap: 8px; max-width: 980px; margin: 0 auto; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.chip .k { font-family: var(--cond); font-weight: 700; font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .v { font-family: var(--display); font-size: 18px; color: var(--teal); font-variant-numeric: tabular-nums; }
.chip.total { background: var(--fg); border-color: var(--fg); }
.chip.total .k { color: #3c4a52; } .chip.total .v { color: var(--ink); }
@media (max-width: 640px) { .rail-in { grid-template-columns: repeat(3, 1fr); } .chip .v { font-size: 15px; } }

/* timeframe panel */
.tf { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 18px; overflow: hidden; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #000; padding: 14px 18px; border-bottom: 3px solid var(--teal); position: relative; }
.bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--red); }
.bar h2 { margin: 0; display: flex; align-items: baseline; gap: 12px; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 4vw, 28px); letter-spacing: .02em; text-wrap: balance; }
.bar h2 .n { color: var(--teal); font-size: .8em; }
.bar .sub { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bar .pct { font-family: var(--display); font-size: clamp(26px, 5vw, 38px); color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1; }
.meter { height: 4px; background: var(--panel-2); } .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), #7cf3e9); transition: width .35s ease; }
.rows { padding: 6px 10px 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 8px; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; }
.row .t small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
.row .w { font-family: var(--cond); font-weight: 700; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.on .w { color: var(--teal); }
.sw { width: 58px; height: 32px; border-radius: 99px; border: 2px solid var(--line); background: var(--panel-2); position: relative; flex: none; padding: 0; transition: background .2s, border-color .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform .2s; }
.row.on .sw { background: var(--teal-dim); border-color: var(--teal); }
.row.on .sw::after { transform: translateX(26px); background: var(--teal); }
.row.req .sw { border-color: var(--red-dim); }
.row.req.on .sw { border-color: var(--teal); }

/* confirm drawer */
.ask { margin: 0 8px 12px; border: 1px solid var(--teal-dim); border-radius: 12px; background: #0a1013; padding: 16px; display: grid; justify-items: center; gap: 12px; text-align: center; }
.ask .pics { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 100%; }
.ask svg, .ask img { width: 300px; max-width: 100%; height: auto; aspect-ratio: 600 / 490; border-radius: 10px; background: #fff; display: block; }
.ask .q { font-weight: 700; font-size: 17px; max-width: 46ch; text-wrap: balance; }
.ask .btns { display: flex; gap: 10px; }
.ask .btns button { min-width: 96px; padding: 10px 18px; border-radius: 9px; font-family: var(--display); font-size: 15px; border: 2px solid; }
.yes { background: rgba(25,211,197,.12); border-color: var(--teal) !important; color: var(--teal); }
.no { background: rgba(255,59,78,.12); border-color: var(--red) !important; color: var(--red); }

/* verdict */
.verdict { border-radius: 18px; border: 2px solid var(--line); background: var(--panel); overflow: hidden; }
.verdict .top { padding: 22px 18px 6px; text-align: center; }
.verdict .k { font-family: var(--display); font-size: 16px; letter-spacing: .08em; color: var(--muted); }
.verdict .big { font-family: var(--tag); font-size: clamp(90px, 22vw, 170px); line-height: .9; color: var(--red); text-shadow: 5px 5px 0 #000; font-variant-numeric: tabular-nums; }
.verdict.go .big { color: var(--teal); }
.verdict .max { color: var(--muted); font-family: var(--cond); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
.call { margin: 14px 18px 0; padding: 14px; border-radius: 12px; text-align: center; font-family: var(--display); font-size: clamp(18px, 4vw, 24px); background: var(--red-dim); color: #ffd6da; }
.verdict.go .call { background: var(--teal-dim); color: #d9fffb; }
.gates { list-style: none; margin: 14px 18px 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gates li { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border-radius: 8px; padding: 9px 10px; font-weight: 600; font-size: 14px; min-width: 0; }
.gates li b { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--red); color: var(--ink); }
.gates li.ok b { background: var(--teal); }
@media (max-width: 560px) { .gates { grid-template-columns: 1fr; } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px; justify-content: center; }
.btn { border: 2px solid var(--fg); background: var(--fg); color: var(--ink); border-radius: 10px; padding: 12px 20px; font-family: var(--display); font-size: 15px; }
.btn.ghost { background: none; color: var(--fg); border-color: var(--line); }
textarea { width: 100%; min-height: 64px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; resize: vertical; }
.note-wrap { margin: 14px 18px 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--teal); color: var(--ink); font-family: var(--display); font-size: 14px; padding: 10px 18px; border-radius: 10px; z-index: 40; }

/* history */
.hist { display: grid; gap: 10px; }
.hcard { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.hcard .sc { font-family: var(--display); font-size: 26px; color: var(--teal); min-width: 70px; font-variant-numeric: tabular-nums; }
.hcard.wait .sc { color: var(--red); }
.hcard .m { min-width: 0; }
.hcard .m b { font-family: var(--display); font-weight: 400; font-size: 16px; }
.hcard .m span { display: block; color: var(--muted); font-size: 13px; }
.hcard .m p { margin: 4px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.hcard button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 13px; }
.empty { text-align: center; padding: 40px 16px; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); }
.empty b { display: block; font-family: var(--tag); font-size: 40px; color: var(--fg); margin-bottom: 6px; }
.foot { margin-top: 26px; color: var(--muted); font-size: 13px; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* nav additions */
.navr { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.langs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.langs button { background: none; border: 0; padding: 8px 10px; border-radius: 7px; font-family: var(--display); font-size: 13px; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--red); color: var(--ink); }
.hero h1 span { color: var(--fg); text-shadow: none; }
.hero h1 .hi { color: var(--teal); text-shadow: 4px 4px 0 var(--ink), 7px 7px 0 var(--red); }

/* history result controls */
.hcard { grid-template-columns: auto 1fr; }
.hcard .ctl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px dashed var(--line); padding-top: 10px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel-2); border: 0; padding: 7px 12px; font-family: var(--cond); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.seg button.w[aria-pressed="true"] { background: var(--teal); color: var(--ink); }
.seg button.l[aria-pressed="true"] { background: var(--red); color: var(--ink); }
.seg button.p[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
.pnl { display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-weight: 600; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pnl input { width: 110px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 600 15px var(--body); font-variant-numeric: tabular-nums; }
.hcard .ctl .del { margin-left: auto; }
.hcard .pl { font-family: var(--display); font-size: 14px; }
.pos { color: var(--teal); } .neg { color: var(--red); }

/* dashboard */
.banner { background: rgba(255,181,71,.12); border: 1px dashed var(--amber); color: var(--amber); border-radius: 10px; padding: 10px 14px; font-weight: 600; margin-bottom: 16px; }
.dtop { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
.dnet { background: linear-gradient(135deg, #0d2a28, var(--panel) 60%); border: 1px solid var(--teal-dim); border-radius: 18px; padding: 22px; position: relative; overflow: hidden; }
.dnet::after { content: "$"; position: absolute; right: 18px; top: 10px; font-family: var(--tag); font-size: 120px; color: rgba(25,211,197,.08); line-height: 1; }
.dnet .big { font-family: var(--display); font-size: clamp(40px, 8vw, 64px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.dnet .sm { font-family: var(--cond); font-weight: 600; font-size: 16px; color: var(--muted); letter-spacing: .04em; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.trio > div, .stat { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.kk { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.vv { font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.dside { display: grid; gap: 16px; }
.dside .stat { border-radius: 16px; padding: 18px; }
.stat.p { background: rgba(25,211,197,.06); border-color: var(--teal-dim); }
.stat.l { background: rgba(255,59,78,.06); border-color: var(--red-dim); }
.stat .vv { font-size: 30px; }
.stat .ss { font-weight: 600; font-size: 14px; margin-top: 2px; }
.quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
.sect-h { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 6px 0 12px; display: flex; gap: 10px; align-items: center; }
.sect-h::before { content: ""; width: 10px; height: 22px; background: var(--red); display: inline-block; transform: skewX(-12deg); }
.calwrap { display: grid; grid-template-columns: 1fr 220px; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 26px; }
.calhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.calhead .mo { font-family: var(--display); font-size: 20px; text-transform: capitalize; }
.calhead button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-family: var(--cond); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.calhead .arr { display: flex; gap: 6px; align-items: center; }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { text-align: center; font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.day { min-height: 74px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); padding: 6px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.day .dn { text-align: right; font-weight: 700; font-size: 14px; color: var(--muted); }
.day .dv { font-family: var(--display); font-size: 13px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day .dc { font-size: 11px; color: var(--muted); }
.day.up { background: rgba(25,211,197,.12); border-color: var(--teal-dim); }
.day.dn2 { background: rgba(255,59,78,.12); border-color: var(--red-dim); }
.day.today { outline: 2px solid var(--teal); outline-offset: -2px; }
.day.blank { background: none; border: 0; }
.weeks { display: grid; gap: 8px; align-content: start; }
.wk { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.wk .vv { font-size: 20px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.boxp { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.wrbar { height: 10px; border-radius: 99px; background: var(--panel-2); overflow: hidden; margin: 8px 0 14px; }
.wrbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), #7cf3e9); }
.ls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ls .stat.p .vv { color: var(--teal); } .ls .stat.l .vv { color: var(--red); }
.wlp { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.wlp .vv { font-size: 28px; }
.rt { display: grid; gap: 8px; }
.rt .r { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 9px 12px; }
.rt .r .pr { font-family: var(--display); font-size: 14px; }
.rt .r span { color: var(--muted); font-size: 13px; }
.rt .r .badge { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--fg); color: var(--ink); }
.rt .r .badge.b { background: var(--teal); } .rt .r .badge.s { background: var(--red); }
.none { color: var(--muted); text-align: center; padding: 30px 0; }
@media (max-width: 860px) { .dtop, .duo, .calwrap { grid-template-columns: 1fr; } .quad { grid-template-columns: 1fr 1fr; } .weeks { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); } }
@media (max-width: 520px) { .trio { grid-template-columns: 1fr; } .day { min-height: 54px; padding: 4px; } .day .dv { font-size: 10px; } .day .dc { display: none; } }

/* score tiers */
.tier { display: inline-block; margin: 6px 0 4px; padding: 6px 14px; border-radius: 8px; color: var(--ink); font-family: var(--display); font-size: 18px; transform: rotate(-2deg); }
.verdict .big { color: var(--red); }
.scale { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; margin: 14px 18px 0; }
.scale .sl { grid-column: 1 / -1; font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.scale .st { border-top: 5px solid var(--c); background: var(--panel-2); border-radius: 0 0 8px 8px; padding: 6px 4px; text-align: center; font-size: 11px; line-height: 1.2; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.scale .st b { display: block; font-family: var(--display); font-weight: 400; font-size: 13px; color: var(--c); }
.scale .st.cur { background: color-mix(in srgb, var(--c) 22%, var(--panel-2)); color: var(--fg); outline: 2px solid var(--c); }
.hcard .sc .tn { display: block; font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
@media (max-width: 640px) { .scale { grid-template-columns: repeat(3, 1fr); } }
[hidden] { display: none !important; }

/* save trade modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(3,5,7,.72); backdrop-filter: blur(6px); display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { width: min(640px, 100%); max-height: 100%; display: flex; flex-direction: column; background: #0c1216; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.mh { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); background: #000; border-top: 4px solid var(--teal); }
.mh h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.x { background: none; border: 0; font-size: 22px; color: var(--fg); padding: 4px 8px; }
.mb { padding: 18px 20px; overflow-y: auto; display: grid; gap: 12px; }
.score { background: rgba(25,211,197,.1); border: 1px solid var(--teal-dim); color: var(--teal); border-radius: 12px; padding: 14px 16px; font-family: var(--display); font-size: 18px; }
.score.lo { background: rgba(255,181,71,.1); border-color: #6b4a14; color: var(--amber); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
@media (max-width: 520px) { .g2 { grid-template-columns: 1fr; } }
.fl { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.fl.red, .red { color: var(--red); } .fl.grn { color: var(--teal); }
.mb input, .mb select, .mb textarea { width: 100%; background: #141c22; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 500 16px var(--body); font-variant-numeric: tabular-nums; }
.mb input.in-red { background: rgba(255,59,78,.07); border-color: var(--red-dim); }
.mb input.in-grn { background: rgba(25,211,197,.06); border-color: var(--teal-dim); }
.mb input.bad, .mb textarea.bad, .drop.bad { border-color: var(--red); box-shadow: 0 0 0 2px rgba(255,59,78,.25); }
.sel { position: relative; display: flex; align-items: center; }
.sel .flag { position: absolute; left: 12px; font-size: 16px; pointer-events: none; }
.sel select { padding-left: 64px; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; font-weight: 700; }
.ls2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ls2 button { border: 1px solid var(--line); background: #141c22; border-radius: 10px; padding: 12px; font-family: var(--display); font-size: 15px; color: var(--muted); }
.ls2 .lg[aria-pressed="true"] { background: rgba(25,211,197,.14); border-color: var(--teal); color: var(--teal); }
.ls2 .sh[aria-pressed="true"] { background: rgba(255,59,78,.14); border-color: var(--red); color: var(--red); }
.mb hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0 0; width: 100%; }
.sh3 { font-family: var(--display); font-size: 17px; display: flex; gap: 8px; align-items: center; }
.sh3 .ic { color: var(--teal); }
.sh3 em { font-family: var(--body); font-style: normal; font-size: 14px; color: var(--red); font-weight: 600; }
.lot { border: 1px solid var(--teal-dim); background: linear-gradient(135deg, rgba(25,211,197,.08), transparent); border-radius: 14px; padding: 16px; }
.lot .lh { display: flex; gap: 10px; align-items: center; font-family: var(--display); font-size: 17px; }
.lot .lh i { width: 34px; height: 34px; border-radius: 9px; background: var(--teal-dim); display: grid; place-items: center; font-style: normal; color: var(--teal); }
.lot .hint { color: var(--muted); text-align: center; padding: 14px 0 4px; }
.lot .lg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.lot .lg3 div { background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px; text-align: center; min-width: 0; }
.lot .lg3 b { display: block; font-family: var(--display); font-size: 20px; color: var(--teal); font-variant-numeric: tabular-nums; }
.lot .lg3 span { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lot .fine { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.drop { display: grid; justify-items: center; gap: 4px; text-align: center; border: 2px dashed var(--line); border-radius: 14px; padding: 22px 14px; cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--teal); }
.drop .up { font-size: 30px; color: var(--fg); line-height: 1; }
.drop .d1 { font-weight: 600; } .drop .d2 { color: var(--muted); font-size: 13px; }
.drop img { max-height: 180px; border-radius: 8px; margin-top: 8px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.err { color: var(--red); font-weight: 600; margin: 0; min-height: 1em; }
.mf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 20px 18px; border-top: 1px solid var(--line); }
.mf button { border-radius: 11px; padding: 14px; font-family: var(--display); font-size: 16px; }
.cancel { background: #141c22; border: 1px solid var(--line); }
.savebtn { background: var(--teal); border: 0; color: var(--ink); }
/* history extras */
.hcard .tp { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--cond); font-weight: 600; font-size: 14px; color: var(--muted); margin-top: 4px; }
.hcard .tp b { color: var(--fg); font-family: var(--cond); font-size: 14px; font-weight: 700; }
.hcard .thumb { grid-column: 1 / -1; max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--line); justify-self: start; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <div class="brand"><div class="mark" aria-hidden="true">TPT</div><div class="nm" data-t="brand"></div></div>
    <div class="navr">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-check" data-view="check" data-t="navCheck"></button>
        <button role="tab" id="tab-hist" data-view="hist" data-t="navHist"></button>
        <button role="tab" id="tab-dash" data-view="dash" data-t="navDash"></button>
      </div>
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="en" lang="en">EN</button><button data-lang="es" lang="es">ES</button><button data-lang="pt" lang="pt-BR">PT</button>
      </div>
    </div>
  </nav>

  <!-- CHECKLIST -->
  <section id="view-check">
    <header class="hero">
      <h1><span data-t="h1a"></span> <span class="hi" data-t="h1b"></span></h1>
      <div class="drip" data-t="tag"></div>
      <p data-t="heroP"></p>
    </header>
    <div class="setup">
      <div style="min-width:0">
        <span class="lbl" id="pair-lbl" data-t="pairLbl"></span>
        <div class="pairs" id="pairs" role="group" aria-labelledby="pair-lbl"></div>
      </div>
      <div>
        <span class="lbl" data-t="dirLbl"></span>
        <div class="dir"><button class="buy" id="dir-buy" aria-pressed="false" data-t="buy"></button><button class="sell" id="dir-sell" aria-pressed="false" data-t="sell"></button></div>
      </div>
    </div>
    <div class="rail" aria-live="polite"><div class="rail-in" id="rail"></div></div>
    <div id="panels"></div>
    <section class="verdict" id="verdict">
      <div class="top">
        <div class="k" data-t="totalScore"></div>
        <div class="big" id="total">0%</div>
        <div class="tier" id="tier"></div>
        <div class="max" id="maxline"></div>
      </div>
      <div class="call" id="call"></div>
      <div class="scale" id="scale"></div>
      <ul class="gates" id="gates"></ul>
      <div class="actions">
        <button class="btn" id="save" data-t="save"></button>
        <button class="btn ghost" id="reset" data-t="reset"></button>
      </div>
    </section>
  </section>

  <!-- HISTORY -->
  <section id="view-hist" hidden>
    <header class="hero"><h1><span data-t="histH1a"></span> <span class="hi" data-t="histH1b"></span></h1><p data-t="histP"></p></header>
    <div class="hist" id="hist"></div>
  </section>

  <!-- DASHBOARD -->
  <section id="view-dash" hidden>
    <header class="hero"><h1><span data-t="dashH1a"></span> <span class="hi" data-t="dashH1b"></span></h1><p data-t="dashP"></p></header>
    <div id="dash"></div>
  </section>

  <p class="foot" data-t="foot"></p>
</div>

<div class="overlay" id="st-overlay" hidden>
  <form class="modal" id="st-form" role="dialog" aria-modal="true" aria-labelledby="st-title" novalidate>
    <div class="mh"><h2 id="st-title" data-t="stTitle"></h2><button type="button" class="x" id="st-close" aria-label="Close">✕</button></div>
    <div class="mb">
      <div class="score" id="st-score"></div>

      <div class="g2">
        <div><label class="fl" for="st-pair"><span data-t="stPair"></span> *</label>
          <div class="sel"><span class="flag" id="st-flag" aria-hidden="true"></span><select id="st-pair"></select></div></div>
        <div><span class="fl"><span data-t="dirLbl"></span> *</span>
          <div class="ls2"><button type="button" class="lg" id="st-long" data-t="stLong"></button><button type="button" class="sh" id="st-short" data-t="stShort"></button></div></div>
      </div>

      <hr>
      <div class="sh3"><span class="ic">▣</span><span data-t="stBal"></span> <em data-t="stReq"></em></div>
      <label class="fl" for="st-bal"><span data-t="stBalUsd"></span> *</label>
      <input id="st-bal" type="number" inputmode="decimal" step="0.01" min="0" placeholder="10,000">

      <hr>
      <div class="sh3"><span class="ic">↗</span><span data-t="stParams"></span></div>
      <div class="g2">
        <div><label class="fl red" for="st-sl">$ <span data-t="stSL"></span> *</label><input id="st-sl" class="in-red" type="number" inputmode="decimal" step="any" placeholder="1.08000"></div>
        <div><label class="fl grn" for="st-tp">$ <span data-t="stTP"></span> *</label><input id="st-tp" class="in-grn" type="number" inputmode="decimal" step="any" placeholder="1.09000"></div>
        <div><label class="fl" for="st-entry"><span data-t="stEntry"></span> *</label><input id="st-entry" type="number" inputmode="decimal" step="any" placeholder="1.08500"></div>
        <div><label class="fl" for="st-risk">% <span data-t="stRisk"></span> *</label><input id="st-risk" type="number" inputmode="decimal" step="0.1" min="0" placeholder="2"></div>
      </div>

      <div class="lot" id="st-lot" aria-live="polite"></div>

      <label class="fl" for="st-notes"><span data-t="stNotes"></span> *</label>
      <textarea id="st-notes" rows="4"></textarea>

      <span class="fl"><span data-t="stImg"></span> <b class="red">*</b></span>
      <label class="drop" id="st-drop" for="st-file">
        <span class="up" aria-hidden="true">⇪</span>
        <span class="d1" data-t="stUp"></span><span class="d2" data-t="stUp2"></span>
        <img id="st-prev" alt="" hidden>
      </label>
      <input id="st-file" type="file" accept="image/png,image/jpeg" class="vh">

      <p class="err" id="st-err" role="alert"></p>
    </div>
    <div class="mf"><button type="button" class="cancel" id="st-cancel" data-t="stCancel"></button><button type="submit" class="savebtn"><span aria-hidden="true">▧</span> <span data-t="stSave"></span></button></div>

<script>
// ---------- chart pictures: real TradingView crops + TradingView-style drawings ----------
const UP = "#3a60f3", DN = "#ea5f5b", EMA_C = "#8f9ae8", ZONE_F = "rgba(214,232,250,.75)", ZONE_L = "#e07a7a", CIRC = "rgba(108,214,230,.45)";
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// path: [[index, close], ...] waypoints; candles follow it with noise
function series(n, path, seed, vol = 2.4) {
  const r = rng(seed), closes = [];
  for (let i = 0; i < n; i++) {
    let k = 0; while (k < path.length - 2 && path[k + 1][0] < i) k++;
    const [i0, p0] = path[k], [i1, p1] = path[k + 1], t = Math.min(1, Math.max(0, (i - i0) / (i1 - i0 || 1)));
    closes.push(p0 + (p1 - p0) * t + (r() - .5) * 2.2 * vol);
  }
  const out = []; let prev = closes[0] - (r() - .5) * vol;
  closes.forEach((c, i) => { const o = prev + (r() - .5) * .5 * vol, hi = Math.max(o, c) + Math.pow(r(), 1.6) * 2.2 * vol, lo = Math.min(o, c) - Math.pow(r(), 1.6) * 2.2 * vol; out.push([o, hi, lo, c]); prev = c; });
  return out;
}
function tv(data, o = {}) {
  const W = 600, H = 490, padT = 30, padB = 30, padL = 8, padR = o.axis ? 70 : 10, n = data.length;
  (o.edit || []).forEach(([i, v]) => data[i] = v);
  let lo = Math.min(...data.map(d => d[2])), hi = Math.max(...data.map(d => d[1]));
  (o.extra || []).forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v); });
  const span = hi - lo; lo -= span * .05; hi += span * .05;
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB), step = (W - padL - padR) / n, x = i => padL + step * (i + .5), bw = step * .72;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${o.alt || "example chart"}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for (let g = 1; g < 6; g++) s += `<line x1="0" x2="${W - padR}" y1="${H * g / 6}" y2="${H * g / 6}" stroke="#f0f3fa"/>`;
  (o.boxes || []).forEach(b => s += `<rect x="${b.x0 != null ? x(b.x0) - step / 2 : 0}" y="${y(b.hi)}" width="${(b.x1 != null ? x(b.x1) + step / 2 : W - padR) - (b.x0 != null ? x(b.x0) - step / 2 : 0)}" height="${y(b.lo) - y(b.hi)}" fill="${b.fill || ZONE_F}" stroke="${b.line || ZONE_L}" stroke-width="1.4"/>` + (b.t ? `<text x="${(b.x0 != null ? x(b.x0) : 10) + 4}" y="${y(b.hi) + 23}" font-family="Barlow, Arial" font-size="21" font-weight="700" fill="${b.tc || "#33414b"}">${b.t}</text>` : ""));
  if (o.ema) { const k = 2 / (o.ema + 1); let e = data[0][3]; const pts = data.map((d, i) => { e = i ? d[3] * k + e * (1 - k) : e; return x(i) + "," + y(e); }); s += `<polyline fill="none" stroke="${EMA_C}" stroke-width="2" points="${pts.join(" ")}"/>`; }
  (o.lines || []).forEach(l => { s += `<line x1="${l.x0 != null ? x(l.x0) : 0}" x2="${l.x1 != null ? x(l.x1) : W - padR}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c || "#333"}" stroke-width="${l.w || 1.4}" ${l.d ? `stroke-dasharray="${l.d}"` : ""}/>`; if (l.t) s += `<text x="${l.tx != null ? x(l.tx) : 10}" y="${y(l.v) + (l.below ? 24 : -8)}" font-family="Barlow, Arial" font-size="21" font-weight="700" fill="${l.c || "#333"}">${l.t}</text>`; });
  data.forEach((d, i) => { const [op, h, l, c] = d, col = c >= op ? UP : DN, t = y(Math.max(op, c)), b = y(Math.min(op, c));
    s += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="1.6"/><rect x="${x(i) - bw / 2}" y="${t}" width="${bw}" height="${Math.max(1.6, b - t)}" fill="${col}" stroke="${col}" stroke-width=".6"/>`; });
  (o.circles || []).forEach(([i, v, r]) => s += `<circle cx="${x(i)}" cy="${y(v)}" r="${r || 22}" fill="${CIRC}" stroke="#6cd6e6" stroke-width="1.5"/>`);
  (o.arrows || []).forEach(([x1, y1, i, v]) => { const X = x(i), Y = y(v); s += `<line x1="${x1}" y1="${y1}" x2="${X + 12}" y2="${Y - 10}" stroke="#e05555" stroke-width="2"/><path d="M${X + 4} ${Y - 3} l14 -2 l-7 -11 z" fill="#e05555"/>`; });
  if (o.pos) { const p = o.pos, x0 = x(p.i) - step / 2, x1 = Math.min(W - padR, x(p.i + p.len)); s += `<rect x="${x0}" y="${y(p.tp)}" width="${x1 - x0}" height="${y(p.entry) - y(p.tp)}" fill="rgba(8,153,129,.18)"/><rect x="${x0}" y="${y(p.entry)}" width="${x1 - x0}" height="${y(p.sl) - y(p.entry)}" fill="rgba(242,54,69,.18)"/><line x1="${x0}" x2="${x1}" y1="${y(p.entry)}" y2="${y(p.entry)}" stroke="#787b86" stroke-width="1.4"/>`;
    s += `<text x="${x0 + 6}" y="${y(p.tp) + 24}" font-family="Barlow, Arial" font-size="21" font-weight="700" fill="#08806c">${p.tpt}</text><text x="${x0 + 6}" y="${y(p.sl) - 9}" font-family="Barlow, Arial" font-size="21" font-weight="700" fill="#c52a3a">${p.slt}</text>`; }
  if (o.axis) { const ticks = 6; for (let t = 0; t <= ticks; t++) { const v = lo + (hi - lo) * t / ticks; s += `<text x="${W - 8}" y="${y(v) + 5}" text-anchor="end" font-family="Barlow, Arial" font-size="13" fill="#6a6d78">${v.toFixed(o.axis)}</text>`; } }

}

// ---------- storage helpers (this browser only) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
let LANG = store.get("tpt-lang", null) || ((navigator.language || "en").startsWith("pt") ? "pt" : (navigator.language || "").startsWith("es") ? "es" : "en");
if (!I18N[LANG]) LANG = "en";
let T = I18N[LANG], PICS = buildPics(T.chart);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- checklist definition (weights from the original Perfect Trade) ----------
const SECTIONS = [
  { key: "W", n: "01", items: [["trend", 10], ["aoi", 10], ["ema", 5], ["round", 5], ["prev", 10], ["rej", 10], ["bnr", 10]] },
  { key: "D", n: "02", items: [["trend", 10], ["aoi", 10], ["ema", 5], ["round", 5], ["prev", 10], ["rej", 10], ["bnr", 10]] },
  { key: "H4", n: "03", items: [["trend", 5], ["aoi", 5], ["ema", 5], ["round", 5], ["prev", 10], ["rej", 5], ["bnr", 10]] },
  { key: "LTF", n: "04", items: [["trend", 5], ["ema", 5], ["bnr", 5]] },
  { key: "ENTRY", n: "05", items: [["sos", 10], ["eng", 10]] },
  { key: "RISK", n: "06", req: true, items: [["sl", 0], ["tp", 0]] },
];
const MAX = SECTIONS.reduce((a, s) => a + s.items.reduce((b, i) => b + i[1], 0), 0);
const PAIRS = ["XAUUSD","NAS100","BTCUSD","EURUSD","GBPUSD","AUDUSD","NZDUSD","USDCAD","USDCHF","USDJPY","EURJPY","GBPJPY","AUDJPY","NZDJPY","CADJPY","EURGBP","EURAUD","GBPAUD","GBPNZD","GBPCAD","GBPCHF","AUDCAD","NZDCAD"];

const state = { on: {}, open: null, pair: "", dir: "", view: "check" };
const $ = (s) => document.querySelector(s);
const k = (sec, id) => sec.key + ":" + id;
const secScore = (sec) => sec.items.reduce((a, [id, w]) => a + (state.on[k(sec, id)] ? w : 0), 0);
const total = () => SECTIONS.reduce((a, s) => a + secScore(s), 0);
const TIERS = [[160, "#19d3c5"], [140, "#2ee6b0"], [120, "#45e08a"], [100, "#6cdc5c"], [90, "#9bd84a"], [80, "#c6d43c"], [70, "#e8c63a"], [60, "#ffb547"], [0, "#ff3b4e"]];
function tier(sc) { const idx = TIERS.findIndex(([min]) => sc >= min); return { name: T.tiers[8 - idx], color: TIERS[idx][1], min: TIERS[idx][0] }; }
function gates() {
  const on = (x) => !!state.on[x];
  return [
    ["W", "D", "H4"].filter((t) => on(t + ":trend")).length >= 2,
    on("W:aoi") || on("D:aoi"),
    on("ENTRY:sos") || on("ENTRY:eng"),
    on("RISK:sl") && on("RISK:tp"),
    !!state.pair && !!state.dir,
  ].map((ok, i) => [T.gates[i], ok]);
}

// ---------- checklist render ----------
function renderPanels() {
  $("#panels").innerHTML = SECTIONS.map((sec) => {
    const [name, sub] = T.sec[sec.key];
    const rows = sec.items.map(([id, w]) => {
      const key = k(sec, id), on = !!state.on[key];
      const label = T.it[id], small = id === "sos" ? T.it.sosSub : sec.req ? T.it.req : "";
      return `<div class="row ${on ? "on" : ""} ${sec.req ? "req" : ""}">
          <div class="t">${label}${small ? `<small>${small}</small>` : ""}</div>
          ${w ? `<div class="w">+${w}%</div>` : ""}
          <button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(name + ": " + label)}" data-k="${key}"></button>
        </div>
        ${state.open === key ? `<div class="ask" role="dialog" aria-label="${esc(label)}">
          <div class="pics">${(PICS[id] || []).join("")}</div>
          <div class="q">${T.q[id]}</div>
          <div class="btns"><button class="yes" data-yes="${key}">${T.yes}</button><button class="no" data-no="${key}">${T.no}</button></div>
        </div>` : ""}`;
    }).join("");
    const max = sec.items.reduce((a, i) => a + i[1], 0), sc = secScore(sec);
    const riskDone = state.on["RISK:sl"] && state.on["RISK:tp"];
    return `<section class="tf" aria-label="${esc(name)}">
      <div class="bar"><div><h2><span class="n">${sec.n}</span>${name}</h2><div class="sub">${sec.req ? sub : `${sc}% ${T.conf} · ${sub}`}</div></div>
      <div class="pct">${sec.req ? (riskDone ? T.set : "—") : sc + "%"}</div></div>
      <div class="meter"><i style="width:${sec.req ? (!!state.on["RISK:sl"] + !!state.on["RISK:tp"]) * 50 : (sc / max) * 100}%"></i></div>
      <div class="rows">${rows}</div></section>`;
  }).join("");
}
function renderRail() {
  $("#rail").innerHTML = SECTIONS.filter((s) => !s.req).map((s) => `<div class="chip"><div class="k">${T.sec[s.key][0]}</div><div class="v">${secScore(s)}%</div></div>`).join("") +
    `<div class="chip total" style="background:${tier(total()).color};border-color:${tier(total()).color}"><div class="k">${T.total} · ${tier(total()).name}</div><div class="v">${total()}%</div></div>`;
}
function renderVerdict() {
  const g = gates(), go = g.every((x) => x[1]);
  const tt = tier(total());
  $("#total").textContent = total() + "%"; $("#total").style.color = tt.color;
  $("#tier").textContent = tt.name; $("#tier").style.background = tt.color;
  $("#scale").innerHTML = `<span class="sl">${T.scale}</span>` + [...TIERS].reverse().map(([min, col], j) => `<span class="st ${tt.min === min ? "cur" : ""}" style="--c:${col}"><b>${min ? min + "%" : "<60%"}</b>${T.tiers[j]}</span>`).join("");
  $("#maxline").textContent = T.outOf(MAX);
  $("#verdict").classList.toggle("go", go);
  $("#call").textContent = go ? T.go : T.wait;
  $("#gates").innerHTML = g.map(([t, ok]) => `<li class="${ok ? "ok" : ""}"><b aria-hidden="true">${ok ? "✓" : "✕"}</b>${t}</li>`).join("");
}
function renderPairs() {
  $("#pairs").innerHTML = PAIRS.map((p) => `<button aria-pressed="${state.pair === p}" data-pair="${p}">${p}</button>`).join("");
  $("#dir-buy").setAttribute("aria-pressed", state.dir === "BUY");
  $("#dir-sell").setAttribute("aria-pressed", state.dir === "SELL");
}
function renderCheck() { renderPanels(); renderRail(); renderVerdict(); renderPairs(); }

function stats(trades) {
  const closed = trades.filter((t) => t.result === "win" || t.result === "loss");
  const wins = closed.filter((t) => t.pnl > 0 || t.result === "win"), losses = closed.filter((t) => t.result === "loss");
  const gp = wins.reduce((a, t) => a + Math.max(0, t.pnl), 0), gl = losses.reduce((a, t) => a + Math.abs(Math.min(0, t.pnl)), 0);
  let best = 0, cur = 0; [...closed].sort((a, b) => a.ts - b.ts).forEach((t) => { cur = t.result === "win" ? cur + 1 : 0; best = Math.max(best, cur); });
  const wr = (arr) => { const c = arr.filter((t) => t.result !== "pending"); return c.length ? Math.round((c.filter((t) => t.result === "win").length / c.length) * 100) : 0; };
  return {
    closed, wins, losses, gp, gl, net: gp - gl, best,
    winRate: closed.length ? Math.round((wins.length / closed.length) * 100) : 0,
    pf: gl ? (gp / gl).toFixed(2) : gp ? "∞" : "0.00",
    avgConf: trades.length ? Math.round(trades.reduce((a, t) => a + (t.score || 0), 0) / trades.length) : 0,

}

const USD_PER = { USD: 1, JPY: 1 / 150, CAD: 1 / 1.37, CHF: 1 / 0.8, GBP: 1.27, AUD: 0.66, NZD: 0.6 };
function spec(p) {
  if (p === "XAUUSD") return { contract: 100, pip: 0.1, quote: "USD", dec: 2 };
  if (p === "NAS100") return { contract: 1, pip: 1, quote: "USD", dec: 1 };
  if (p === "BTCUSD") return { contract: 1, pip: 1, quote: "USD", dec: 1 };
  const q = p.slice(3); return { contract: 100000, pip: q === "JPY" ? 0.01 : 0.0001, quote: q, dec: q === "JPY" ? 3 : 5 };
}
const pairLabel = (p) => (p.length === 6 && !p.startsWith("NAS") ? p.slice(0, 3) + "/" + p.slice(3) : p);
const pairFlag = (p) => p === "NAS100" ? FLAG.NAS : `${FLAG[p.slice(0, 3)] || ""}/${FLAG[p.slice(3)] || ""}`;

const M = { dir: "LONG", img: "" };
const mf = (id) => document.getElementById(id);
function calc() {
  const p = mf("st-pair").value, s = spec(p), bal = +mf("st-bal").value, risk = +mf("st-risk").value, e = +mf("st-entry").value, sl = +mf("st-sl").value, tp = +mf("st-tp").value;
  if (!sl || !e || !bal || !risk) return null;
  let usdPer = USD_PER[s.quote] || 1;
  if (s.quote === "USD") usdPer = 1;
  const dist = Math.abs(e - sl), valuePerUnitPerLot = s.contract * usdPer;
  if (!dist) return null;
  const riskUsd = (bal * risk) / 100, lots = Math.floor((riskUsd / (dist * valuePerUnitPerLot)) * 100) / 100;
  const rr = tp ? Math.abs(tp - e) / dist : 0, reward = tp ? Math.abs(tp - e) * valuePerUnitPerLot * lots : 0;
  return { lots, riskUsd, rr, pips: dist / s.pip, reward, actualRisk: dist * valuePerUnitPerLot * lots };
}

}
function openSave() {
  mf("st-pair").innerHTML = PAIRS.map((p) => `<option value="${p}">${pairLabel(p)}</option>`).join("");
  mf("st-pair").value = state.pair || "EURUSD";
  M.dir = state.dir === "SELL" ? "SHORT" : "LONG"; M.img = "";
  const lastBal = store.get("tpt-balance", ""); mf("st-bal").value = lastBal;
  ["st-sl", "st-tp", "st-entry", "st-notes"].forEach((id) => (mf(id).value = "")); mf("st-risk").value = store.get("tpt-risk", "");
  if (PREFILL && PREFILL.pair === mf("st-pair").value) { if (PREFILL.entry) mf("st-entry").value = PREFILL.entry; if (PREFILL.sl) mf("st-sl").value = PREFILL.sl; if (PREFILL.tp) mf("st-tp").value = PREFILL.tp; }
  mf("st-prev").hidden = true; mf("st-prev").removeAttribute("src"); mf("st-err").textContent = "";
  document.querySelectorAll(".mb .bad").forEach((el) => el.classList.remove("bad"));
  const ph = spec(mf("st-pair").value).dec; ["st-sl", "st-tp", "st-entry"].forEach((id) => (mf(id).step = "any"));
  renderModalText();
  mf("st-overlay").hidden = false; document.body.style.overflow = "hidden";
  setTimeout(() => mf("st-bal").focus(), 30);
}
function closeSave() { mf("st-overlay").hidden = true; document.body.style.overflow = ""; }
mf("st-close").addEventListener("click", closeSave);
mf("st-cancel").addEventListener("click", closeSave);
mf("st-overlay").addEventListener("click", (e) => { if (e.target.id === "st-overlay") closeSave(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !mf("st-overlay").hidden) closeSave(); });
mf("st-long").addEventListener("click", () => { M.dir = "LONG"; renderModalText(); });
mf("st-short").addEventListener("click", () => { M.dir = "SHORT"; renderModalText(); });
mf("st-pair").addEventListener("change", renderModalText);
["st-bal", "st-sl", "st-tp", "st-entry", "st-risk"].forEach((id) => mf(id).addEventListener("input", () => { mf(id).classList.remove("bad"); renderLot(); }));

// image: compress to a small JPEG so it fits in browser storage
function loadImage(file) {
  mf("st-err").textContent = "";
  if (!file || !/image\/(png|jpe?g)/.test(file.type) || file.size > 10 * 1024 * 1024) { mf("st-err").textContent = T.errImg; return; }
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
      const scale = Math.min(1, 1100 / im.width), c = document.createElement("canvas"); c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); M.img = c.toDataURL("image/jpeg", 0.72);
      mf("st-prev").src = M.img; mf("st-prev").hidden = false; mf("st-drop").classList.remove("bad"); };
    im.src = r.result; };
  r.readAsDataURL(file);
}
mf("st-file").addEventListener("change", (e) => loadImage(e.target.files[0]));
const drop = mf("st-drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => loadImage(e.dataTransfer.files[0]));
document.addEventListener("paste", (e) => { if (mf("st-overlay").hidden) return; const f = [...(e.clipboardData?.files || [])][0]; if (f) loadImage(f); });

mf("st-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const req = ["st-bal", "st-sl", "st-tp", "st-entry", "st-risk", "st-notes"];
  let ok = true; req.forEach((id) => { const bad = !String(mf(id).value).trim() || (id !== "st-notes" && !(+mf(id).value > 0)); mf(id).classList.toggle("bad", bad); if (bad) ok = false; });
  if (!M.img) { drop.classList.add("bad"); ok = false; }
  if (!ok) { mf("st-err").textContent = T.errReq; return; }
  const en = +mf("st-entry").value, sl = +mf("st-sl").value, tp = +mf("st-tp").value;
  const long = M.dir === "LONG";
  if (long ? !(sl < en && tp > en) : !(sl > en && tp < en)) { mf("st-err").textContent = T.errSide; mf("st-sl").classList.add("bad"); mf("st-tp").classList.add("bad"); return; }
  const c = calc();
  const trade = { id: String(Date.now()), ts: Date.now(), pair: mf("st-pair").value, dir: long ? "BUY" : "SELL", score: total(), go: gates().every((x) => x[1]),
    note: mf("st-notes").value.trim(), result: "pending", pnl: 0, balance: +mf("st-bal").value, entry: en, sl, tp, riskPct: +mf("st-risk").value,
    lots: c ? c.lots : 0, riskUsd: c ? +c.actualRisk.toFixed(2) : 0, rewardUsd: c ? +c.reward.toFixed(2) : 0, rr: c ? +c.rr.toFixed(2) : 0, img: M.img, checks: Object.keys(state.on) };
  const h = loadH(); h.unshift(trade);
  let saved = false; try { localStorage.setItem(HK, JSON.stringify(h)); saved = true; } catch (err) { mf("st-err").textContent = err && err.name === "QuotaExceededError" ? T.errFull : T.errStore; }
  if (!saved) return;
  store.set("tpt-balance", trade.balance); store.set("tpt-risk", trade.riskPct);
  closeSave(); toast(T.savedTrade); setView("dash");
});

window.renderModalText = renderModalText;

// ---------- pre-fill from the Forex Trading Desk ("Open in my checklist") ----------
// The Desk links here as  #prefill=<base64 JSON {pair, dir, on:[box ids], entry, sl, tp, score, tier, at}>
let PREFILL = null;
const PF_TXT = {
  en: (n, sc, tr, at) => `<b>Pre-filled by your Forex Trading Desk</b> (${at}): ${n} boxes ticked, Desk score ${sc}% · ${tr}. Check every box against your chart and untick anything you don't agree with, then Save trade. Add your profit or loss later in History.`,
  es: (n, sc, tr, at) => `<b>Completado por tu Forex Trading Desk</b> (${at}): ${n} casillas marcadas, puntaje ${sc}% · ${tr}. Revisa cada casilla con tu gráfico y desmarca lo que no veas, luego Guarda la operación. Agrega tu ganancia o pérdida después en Historial.`,
  pt: (n, sc, tr, at) => `<b>Preenchido pelo seu Forex Trading Desk</b> (${at}): ${n} caixas marcadas, pontuação ${sc}% · ${tr}. Confira cada caixa no seu gráfico e desmarque o que não concordar, depois Salve o trade. Adicione seu lucro ou prejuízo depois no Histórico.`,
};
function applyPrefill() {
  const m = location.hash.match(/^#prefill=([A-Za-z0-9_\-=]+)/);
  if (!m) return;
  try {
    const raw = atob(m[1].replace(/-/g, "+").replace(/_/g, "/"));
    const j = JSON.parse(decodeURIComponent(Array.from(raw, (c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")));
    const valid = new Set(SECTIONS.flatMap((sec) => sec.items.map(([id]) => k(sec, id))));
    state.on = {}; (j.on || []).forEach((id) => { if (valid.has(id)) state.on[id] = true; });
    if (j.pair) { if (!PAIRS.includes(j.pair)) PAIRS.push(j.pair); state.pair = j.pair; }
    if (j.dir === "BUY" || j.dir === "SELL") state.dir = j.dir;
    PREFILL = j;
    const div = document.createElement("div"); div.id = "pf-banner"; div.setAttribute("role", "status");
    div.style.cssText = "margin:12px 0;padding:12px 14px;border-radius:12px;border:1px solid #2ee6b0;background:rgba(46,230,176,.10);font-size:14px;line-height:1.45";
    div.dataset.n = Object.keys(state.on).length;
    $("#view-check").prepend(div); renderPrefillBanner();
  } catch (err) { console.warn("prefill ignored", err); }
  try { history.replaceState(null, "", location.pathname); } catch {}
}
function renderPrefillBanner() {
  const d = document.getElementById("pf-banner"); if (!d || !PREFILL) return;
  d.innerHTML = (PF_TXT[LANG] || PF_TXT.en)(d.dataset.n, PREFILL.score ?? "—", esc(PREFILL.tier || ""), esc(PREFILL.at || ""));
}
applyPrefill();
__init();
</script>
